project_name: "ai-foundations-template"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels: []
date_format: yyyy-mm-dd
max_column_width: 20
default_editor: "vi"
auto_open_browser: false
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 30
task_prefix: "task"
definition_of_done: ["Every acceptance criterion verified with evidence (command and result, render output, or screenshot)", "Smoke test passes for all three stacks when template/ or copier.yml changed", "Independent review loop reached PASS for non-trivial changes", "Non-trivial decisions recorded in docs/decisions.md", "Committed and pushed"]
